name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: echo github.ref
        run: echo ${{ github.ref }} ${{ contains(github.ref, 'refs/tags') }}
  release:
    runs-on: ubuntu-latest
    needs: test
    if: contains(github.ref, 'refs/tags')
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Release
        run: echo ${{ github.ref }}
