name: Test and Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install
        uses: ./.github/workflows/install

      - name: Lint
        run: |
          pnpm run-all-checks
          pnpm clean
          pnpm build
          pnpm test-packaging
  release:
    runs-on: ubuntu-latest
    needs: test
    if: contains(github.ref, 'refs/tags')
    steps:
      - name: Check out
        uses: actions/checkout@v3
      - name: Release
        run: echo ${{ github.ref }}
